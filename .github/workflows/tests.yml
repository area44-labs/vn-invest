name: Tests

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "components.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths-ignore:
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "components.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv pip install -r requirements.txt --system

      - name: Run Python tests
        run: uv run python scripts/tests/run_tests.py
