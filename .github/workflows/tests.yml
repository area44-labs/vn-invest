name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for relevant file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - "**/*.py"
              - "pyproject.toml"
              - "uv.lock"
              - "pytest.ini"
              - ".github/workflows/tests.yml"
            frontend:
              - "src/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "vite.config.ts"
              - "tsconfig.json"
              - "components.json"
              - ".github/workflows/tests.yml"

  backend-test:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Python tests
        run: uv run --frozen pytest

  frontend-test:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+ environment
        uses: area44/workflows/vite-plus@05e99afee9dc6c9bd7af6d14bf07b53854dafdf0 # v7.0.1

      - name: Run Vite+ frontend tests
        run: pnpm exec vp test

      - name: Run Vite+ frontend check
        run: pnpm exec vp check
