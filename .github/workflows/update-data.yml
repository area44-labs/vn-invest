name: Update Data

on:
  schedule:
    # 11:00 UTC = 18:00 ICT (Vietnam ICT = UTC+7), Mon-Fri
    # Scheduled after HOSE/HNX/UPCoM EOD market close and data updates complete
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          version-file: "pyproject.toml"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run production pipeline
        env:
          VNSTOCK: ${{ secrets.VNSTOCK || vars.VNSTOCK }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY || secrets.VNSTOCK || vars.VNSTOCK_API_KEY || vars.VNSTOCK }}
        run: uv run --frozen python scripts/generate_report.py --update

      - name: Commit and push generated artifacts
        run: |
          git status --short
          if git diff --quiet generated/ && [ -z "$(git status --porcelain generated/)" ]; then
            echo "No changes to generated artifacts."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add generated/
            git commit -m "chore(data): update daily market recommendations"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
