name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.0.2
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v4.0.0

      - name: Build SSG artifacts for SSG tests
        run: |
          pnpm install
          pnpm build

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --no-deps
          python -m pip install ruff
          python -m pip install requests pandas jsonschema openpyxl vnai pydantic tenacity beautifulsoup4 seaborn pytz psutil packaging importlib-metadata

      - name: Run Python tests
        run: python scripts/tests/run_tests.py

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .
