name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@39cd7d89617d3d750058b7a9f8f26db12c295c2e # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.txt
          python -m pip install ruff
          python -m pip install requests pandas jsonschema openpyxl vnai pydantic tenacity beautifulsoup4 seaborn pytz psutil packaging importlib-metadata

      - name: Run Python tests
        run: python scripts/tests/run_tests.py

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .
