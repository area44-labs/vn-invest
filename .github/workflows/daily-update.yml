name: Daily Data Update

on:
  schedule:
    # 11:00 UTC = 18:00 ICT (Vietnam ICT = UTC+7), Mon-Fri
    # Scheduled after HOSE/HNX/UPCoM EOD market close and data updates complete
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run production pipeline
        run: uv run --frozen python scripts/generate_report.py --update

      - name: Commit and push generated artifacts
        run: |
          git status --short
          if git diff --quiet generated/ && [ -z "$(git status --porcelain generated/)" ]; then
            echo "No changes to generated artifacts."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add generated/
            git commit -m "chore(data): update daily market recommendations"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
