name: Daily Automated Production Data Update

on:
  schedule:
    # 11:00 UTC = 18:00 ICT (Vietnam ICT = UTC+7), Mon-Fri
    # Scheduled after HOSE/HNX/UPCoM EOD market close and data updates complete
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run production pipeline
        run: python scripts/generate_report.py --update

      - name: Verify production monitoring status
        run: |
          python -c "
          import json, sys
          with open('generated/monitoring.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          status = data.get('overall_status')
          print(f'Production monitoring overall_status: {status}')
          if status != 'PASS':
              print(f'ERROR: Production monitoring failed with status: {status}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Run Python test suite
        run: python scripts/tests/run_tests.py

      - name: Install Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .

      - name: Install pnpm
        uses: pnpm/action-setup@fe40b38006d5c3b499882a1707d89053c7a8a68b # v4.0.0

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba78417256731a5e2432d0ff8419616d0047 # v4.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend check
        run: pnpm check

      - name: Build SSG frontend
        run: pnpm build

      - name: Verify recommendations artifact integrity
        run: |
          python -c "
          import json, sys
          with open('generated/recommendations.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          required_keys = ['schema_version', 'signal_model_version', 'generated_at', 'data_as_of', 'summary', 'recommendations']
          for k in required_keys:
              if k not in data or data[k] is None:
                  print(f'ERROR: Missing or null required field \'{k}\' in recommendations.json', file=sys.stderr)
                  sys.exit(1)

          recs = data['recommendations']
          summary = data['summary']
          if not isinstance(recs, list) or not isinstance(summary, dict):
              print('ERROR: Invalid data types for recommendations or summary', file=sys.stderr)
              sys.exit(1)

          print(f'Validated recommendations artifact: data_as_of={data[\"data_as_of\"]}, total_scanned={summary.get(\"total_scanned\")}, recs_count={len(recs)}')
          "

      - name: Commit and push generated artifacts
        run: |
          git status --short
          if git diff --quiet generated/ && [ -z "$(git status --porcelain generated/)" ]; then
            echo "No changes to generated artifacts to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add generated/
            git commit -m "chore(data): update daily market recommendations"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
