[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-invest"
version = "2.0.0"
description = "VN Invest - Quantitative Stock Recommendation System"
requires-python = ">=3.15.2"
dependencies = [
  "vnstock>=5.2.1",
  "requests>=2.34.2",
  "pandas>=3.1.0",
  "numpy>=2.5.4",
  "openpyxl>=3.1.5",
  "jsonschema>=4.26.0",
  "pytest>=9.2.0",
  "pytest-mock>=3.17.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
override-dependencies = ["pandas>=3.0.0", "numpy>=2.5.0"]

[[tool.uv.index]]
name = "vnstocks"
url = "https://vnstocks.com/api/packages"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "unit: Unit tests for domain, data, quant, pipeline, monitoring, schema, risk, performance, artifacts",
  "integration: Integration tests for pipeline stages, artifact publishing, historical reports",
  "e2e: End-to-end integration tests",
  "live: Tests requiring live network or external resources",
  "slow: Tests taking more than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["AGENTS.md"]

[dependency-groups]
dev = ["ruff>=0.17.3"]
