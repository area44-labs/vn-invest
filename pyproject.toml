[project]
name = "vn-invest"
version = "0.1.0"
description = "VN Invest - Quantitative Stock Recommendation System"
requires-python = ">=3.14"
dependencies = [
  "vnstock>=4.0.2",
  "requests>=2.34.2",
  "pandas>=3.0.0",
  "numpy>=2.5.0",
  "openpyxl>=3.1.5",
  "jsonschema>=4.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["AGENTS.md"]
